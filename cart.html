<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart – BookVerse</title>
    <link rel="icon" href="assests/image/favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/cart.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header>
      <h1>📚 BookVerse</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="books.html">Books</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html" id="cart-link"
          >🛒 Cart (<span id="cart-count">0</span>)</a
        >
        <a href="login.html">Login</a>
        <button id="theme-toggle" type="button">🌙</button>
      </nav>
    </header>

    <main>
      <section class="cart-section">
        <h2>Your Shopping Cart</h2>
        <table class="cart-table">
          <thead>
            <tr>
              <th>Book</th>
              <th>Title</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Subtotal</th>
              <th>Remove</th>
            </tr>
          </thead>
          <tbody id="cart-items"></tbody>
          <tfoot>
            <tr>
              <td colspan="4"><strong>Total:</strong></td>
              <td colspan="2"><strong id="cart-total">₹0</strong></td>
            </tr>
          </tfoot>
        </table>

        <section class="order-summary">
          <h3>Order Summary</h3>
          <dl>
            <dt>Subtotal:</dt>
            <dd id="summary-subtotal">₹0</dd>
            <dt>Shipping:</dt>
            <dd>FREE</dd>
            <dt>Tax (5% GST):</dt>
            <dd id="summary-tax">₹0</dd>
            <dt><strong>Grand Total:</strong></dt>
            <dd><strong id="summary-total">₹0</strong></dd>
          </dl>
          <a href="#" class="btn-primary">Proceed to Checkout</a>
          <a href="books.html" class="btn-secondary">Continue Shopping</a>
        </section>
      </section>
    </main>

    <footer>
      <div class="footer-bottom">
        <p>&copy; 2026 BookVerse. All rights reserved.</p>
      </div>
    </footer>

    <script src="js/books.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart-page.js"></script>
  </body>
</html>
